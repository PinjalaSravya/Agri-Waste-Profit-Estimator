<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Waste Profit Estimator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }
        h1 {
            color: #2E7D32;
            text-align: center;
            margin-bottom: 24px;
            font-size: 22px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }
        select, input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #A5D6A7;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }
        select:focus, input:focus { border-color: #2E7D32; }
        button {
            width: 100%;
            padding: 12px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1B5E20; }
        #result {
            margin-top: 24px;
            background: #E8F5E9;
            border-radius: 10px;
            padding: 20px;
            display: none;
        }
        #result h2 { color: #2E7D32; margin-bottom: 12px; }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #C8E6C9;
            font-size: 15px;
        }
        .result-row:last-child { border-bottom: none; }
        .profit {
            font-size: 20px;
            font-weight: bold;
            color: #2E7D32;
            text-align: center;
            margin-top: 12px;
        }
        .error { color: red; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌾 Agri Waste Profit Estimator 🌾</h1>

        <label>Select Waste Type:</label>
        <select id="waste">
            <option value="">-- Select Waste --</option>
            {% for key, label in wastes.items() %}
            <option value="{{ key }}">{{ label }}</option>
            {% endfor %}
        </select>

        <label>Enter Quantity (in tons):</label>
        <input type="number" id="quantity" placeholder="e.g. 10" min="0.1" step="0.1">

        <button onclick="calculate()">Calculate Profit</button>

        <div id="error" class="error"></div>

        <div id="result">
            <h2>📊 Estimation Result</h2>
            <div class="result-row"><span>Waste Type</span><span id="r-waste"></span></div>
            <div class="result-row"><span>Quantity</span><span id="r-qty"></span></div>
            <div class="result-row"><span>Price per Ton</span><span id="r-price"></span></div>
            <div class="result-row"><span>Possible Uses</span><span id="r-uses"></span></div>
            <div class="profit">Estimated Profit: ₹<span id="r-total"></span></div>
        </div>
    </div>

    <script>
        async function calculate() {
            const waste = document.getElementById("waste").value;
            const quantity = document.getElementById("quantity").value;
            const errorDiv = document.getElementById("error");
            const resultDiv = document.getElementById("result");

            errorDiv.textContent = "";
            resultDiv.style.display = "none";

            if (!waste) { errorDiv.textContent = "Please select a waste type."; return; }
            if (!quantity || quantity <= 0) { errorDiv.textContent = "Enter a valid quantity."; return; }

            const response = await fetch("/calculate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ waste, quantity })
            });

            const data = await response.json();

            if (data.error) { errorDiv.textContent = data.error; return; }

            document.getElementById("r-waste").textContent = data.waste;
            document.getElementById("r-qty").textContent = data.quantity + " tons";
            document.getElementById("r-price").textContent = "₹" + data.price_per_ton;
            document.getElementById("r-uses").textContent = data.uses.join(", ");
            document.getElementById("r-total").textContent = data.total_profit.toLocaleString();

            resultDiv.style.display = "block";
        }
    </script>
</body>
</html>
